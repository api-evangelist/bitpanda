aid: bitpanda
name: Bitpanda
description: >-
  Bitpanda is a European retail investment platform, founded in Vienna in 2014, that lets
  users buy, sell, and hold cryptocurrencies, stocks, ETFs, precious metals, commodities, and
  crypto indices from a single account. Its developer surface centres on the read-only Bitpanda
  Platform API (developer.bitpanda.com) for portfolio, wallet balances, transactions, asset
  metadata, and live ticker prices, authenticated with an X-Api-Key header and cursor-based
  pagination, and on Bitpanda Fusion, the automated-trading product offering programmatic order
  execution across aggregated liquidity. Bitpanda Labs maintains an official MCP server, an
  Agent Skill, and a Go CLI (bp) as first-party ways for developers and AI agents to reach the
  API. This profile was surfaced as a portfolio company of Speedinvest and enriched by the API
  Evangelist pipeline from Bitpanda's public developer surface.
